services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - cleaning_data:/app/data
    environment:
      - DB_PATH=/app/data/cleaning.db
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4004:443"
    volumes:
      - /var/lib/tailscale/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  cleaning_data:
